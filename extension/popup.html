<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MindCanvas</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="bar">
    <span class="brand">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M5 14 10 5l5 9z" fill="none" stroke="#2a2e36" stroke-width="1.2" />
        <circle cx="10" cy="5" r="2.6" fill="#35d6f2" />
        <circle cx="5" cy="14" r="2.6" fill="#8cf06e" />
        <circle cx="15" cy="14" r="2.6" fill="#ff73c6" />
      </svg>
      MindCanvas
    </span>
    <span class="status" id="status"><span class="dot"></span><span id="statusText">Connecting</span></span>
  </header>

  <main>
    <h1>Map what you have read</h1>

    <div class="range" role="radiogroup" aria-label="How far back">
      <button role="radio" data-days="1" aria-checked="true">Today</button>
      <button role="radio" data-days="7" aria-checked="false">7 days</button>
      <button role="radio" data-days="30" aria-checked="false">30 days</button>
    </div>

    <p class="count" id="count" aria-live="polite">Counting pages…</p>

    <button class="primary" id="send" disabled>Send pages</button>

    <div class="progress" id="progress" hidden>
      <div class="track"><div class="fill"></div></div>
      <p>Reading and summarising each page. This can take a few minutes, and keeps going if you close this window.</p>
    </div>

    <p class="message" id="message" role="status" hidden></p>
  </main>

  <footer>
    <button class="link" id="open">Open MindCanvas</button>
    <details>
      <summary>Server</summary>
      <form id="serverForm">
        <input id="serverUrl" type="url" spellcheck="false" aria-label="Server address" />
        <button type="submit">Save</button>
      </form>
    </details>
  </footer>

  <p class="privacy">Only page titles and links are sent, and only to your own server.</p>

  <script type="module" src="popup.js"></script>
</body>
</html>
